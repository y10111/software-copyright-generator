name: Build macOS Installer

on:
  workflow_dispatch:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Download JavaFX jmods (macOS aarch64)
        run: |
          mkdir -p javafx-osx-aarch_64
          curl -L -o javafx-jmods.zip https://download2.gluonhq.com/openjfx/21.0.6/openjfx-21.0.6_osx-aarch64_bin-jmods.zip
          unzip -q javafx-jmods.zip -d javafx-osx-aarch_64
          rm javafx-jmods.zip
      - name: Build with Maven
        run: mvn -B clean install --file pom.xml
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macOS-dmg
          path: target/*.dmg