name: Build Windows Installer

on:
  workflow_dispatch:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Download Wix
        uses: i3h/download-release-asset@v1
        with:
          owner: wixtoolset
          repo: wix3
          tag: wix3112rtm
          file: wix311-binaries.zip
      - name: Decompress Wix
        uses: DuckSoft/extract-7z-action@v1.0
        with:
          pathSource: wix311-binaries.zip
          pathTarget: ./target/wix
      - name: Add Wix to Path
        shell: bash
        run: echo "$PWD/target/wix" >> $GITHUB_PATH
      - name: Verify WiX
        shell: bash
        run: |
          ls -la target/wix/
          echo "---"
          which light && echo "WiX OK"
      - name: Maven package (jlink only)
        run: mvn -e package --file pom.xml
      - name: Run jpackage manually
        shell: bash
        run: |
          echo "=== jpackage args ==="
          cat target/packaging/windows-jpackage.txt
          echo "=== running jpackage ==="
          jpackage @target/packaging/windows-jpackage.txt 2>&1
        continue-on-error: true
      - name: Build with Maven (full)
        run: mvn -e install --file pom.xml
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Windows-msi
          path: target/*.msi