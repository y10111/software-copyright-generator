name: Build Windows Installer

on:
  workflow_dispatch:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Download Wix
        uses: i3h/download-release-asset@v1
        with:
          owner: wixtoolset
          repo: wix3
          tag: wix3112rtm
          file: wix311-binaries.zip
      - name: Decompress Wix
        uses: DuckSoft/extract-7z-action@v1.0
        with:
          pathSource: wix311-binaries.zip
          pathTarget: ./target/wix
      - name: Add Wix to Path
        shell: bash
        run: echo "$PWD/target/wix" >> $GITHUB_PATH
      - name: Verify WiX
        shell: bash
        run: |
          ls -la target/wix/
          echo "---"
          echo "Checking light.exe..."
          which light || echo "WARNING: light.exe NOT on PATH!"
      - name: Build with Maven
        run: mvn -e clean install --file pom.xml
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Windows-msi
          path: target/*.msi